name: Build packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r packaging/requirements.txt
      - name: Unit and GUI tests
        env:
          SHUTDOWN_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PowerTimer-Windows-x64 --add-data "${{ github.workspace }}/LICENSE:." --specpath build python_exp.py
      - name: Test executable in simulation mode
        run: python scripts/check_package.py dist/PowerTimer-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PowerTimer-Windows-x64
          path: dist/PowerTimer-Windows-x64.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk xvfb squashfs-tools desktop-file-utils
      - name: Set up isolated builder
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r packaging/requirements.txt
      - name: Unit and GUI tests
        env:
          SHUTDOWN_REQUIRE_GUI: '1'
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - name: Build AppImage
        env:
          PYTHON: .venv/bin/python
        run: bash scripts/build_appimage.sh
      - name: Test AppImage in simulation mode
        run: xvfb-run -a python3 scripts/check_package.py dist/PowerTimer-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: PowerTimer-Linux-x86_64
          path: dist/PowerTimer-Linux-x86_64.AppImage
          if-no-files-found: error
